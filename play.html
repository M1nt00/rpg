... 뒷부분은 누군가 깎아 냈다. 경험치를 얻었다.",exp:120,flag:"lore_tablet"}]},{label:"비석 아래를 판다",outcomes:[{chance:.6,text:"비석 아래에서 뇌정석이 묻힌 상자를 찾았다.",items:[{id:"thunder_crystal",n:2},{id:"enh_stone_hi",n:1}]},{chance:.4,text:"비석을 지키던 파수병이 깨어났다!",battle:["@pool","@pool","@pool"]}]}]},{id:"ev_rift",title:"공허의 균열",text:"허공에 검은 균열이 벌어져 있다. 안쪽에서 색을 잃은 마물들이 기어 나오려 한다.",choices:[{label:"균열을 봉인한다 (전투)",outcomes:[{text:"균열에서 마물들이 쏟아져 나온다! 쓰러뜨리면 균열이 닫힐 것이다.",battle:["@pool","@pool","@pool"],gold:150,items:[{id:"enh_stone_hi",n:1}]}]},{label:"멀리 돌아간다",outcomes:[{text:"괜히 건드리지 말자. 균열을 피해 돌아갔다."}]}]},{id:"ev_lost_miner",title:"길 잃은 광부",text:'어두운 갱도에서 어린 드워프 광부가 울고 있다. "등불이 꺼져서 길을 못 찾겠어요..."',choices:[{label:"성채까지 데려다준다",outcomes:[{text:"광부를 무사히 데려다주었다. 감사의 표시로 심연 보석을 받았다.",items:[{id:"deep_gem",n:2}],exp:150}]},{label:"길만 알려 준다",outcomes:[{text:'"고마워요!" 광부는 씩씩하게 뛰어갔다.',exp:40}]}]},{id:"ev_chest_mimic",title:"황금 상자",text:"갱도 끝에 어울리지 않게 화려한 황금 상자가 놓여 있다.",choices:[{label:"연다",outcomes:[{chance:.55,text:"상자 안은 보물로 가득했다!",gold:300,equip:"epic"},{chance:.45,text:"상자가 이빨을 드러냈다! 주변의 마물까지 몰려온다.",battle:["@pool","@pool","@pool"],gold:200}]},{label:"그냥 둔다",outcomes:[{text:"너무 수상하다. 손대지 않기로 했다."}]}]},{id:"ev_memory",title:"색 바랜 기억",text:"첨탑 벽에 잿빛 그림이 걸려 있다. 다섯 신전 앞에 선 한 사람 — 옛 계승자 아스텔. 그의 곁에는 아무도 없다.",choices:[{label:"그림을 바라본다",outcomes:[{text:'"혼자서도 충분해. 다섯 원소는 나 하나면 돼." 그림 속 목소리가 들린 것 같다. 동료들이 말없이 곁에 선다. 파티 HP·MP 50% 회복.',hpPct:.5,mpPct:.5}]},{label:"그림을 찢는다",outcomes:[{text:"그림 뒤에서 숨겨진 보급품을 찾았다.",items:[{id:"hipotion",n:2},{id:"ether",n:2}]}]}]}],qa=[{id:"q_main",region:0,kind:"main",name:"다섯 신전의 해방",giver:"",desc:"공허에 침묵한 다섯 원소 신전을 해방하고, 공허의 근원을 찾아라.",target:{},reward:{}},{id:"q1_wolves",region:1,kind:"kill",name:"잿빛 늑대 소탕",giver:"잿골 마을 촌장",desc:"마을 가축을 노리는 잿빛 늑대를 4마리 처치해 주게.",target:{enemy:"ash_wolf",count:4},reward:{gold:120,exp:40,items:[{id:"potion",n:2}]}},{id:"q1_ore",region:1,kind:"collect",name:"잿불 광석 수집",giver:"대장장이 도르",desc:"잿불 광석 3개만 구해 오면, 그걸로 강화석을 만들어 주지.",target:{item:"ember_ore",count:3},reward:{gold:60,items:[{id:"enh_stone",n:3}]}},{id:"q1_kyle",region:1,kind:"companion",name:"[카일] 기사의 맹세",giver:"카일",desc:"공허에 삼켜진 스승, 타락한 기사단장을 쓰러뜨려 안식을 주자.",target:{enemy:"fallen_captain",count:1},reward:{legendary:"lg_ancestor_shield",exp:80},auto:!0,requiresAlly:"kyle"},{id:"q2_serpent",region:2,kind:"kill",name:"호수 뱀 퇴치",giver:"안개나루 뱃사공",desc:"배를 뒤집는 호수 뱀 5마리를 처치해 주세요.",target:{enemy:"lake_serpent",count:5},reward:{gold:260,exp:120,items:[{id:"ether",n:2}]}},{id:"q2_medicine",region:2,kind:"deliver",name:"약상자 배달",giver:"안개나루 약사",desc:"호숫가 오두막의 아픈 아이에게 약상자를 전해 주세요.",target:{item:"medicine_box",node:"r2_n9"},giveItem:"medicine_box",reward:{gold:200,exp:150,items:[{id:"hipotion",n:1}]}},{id:"q2_serin",region:2,kind:"companion",name:"[세린] 버려진 신전",giver:"세린",desc:"신전을 버리고 공허를 숭배하는 대사제, 안개의 이단자를 막아야 해요.",target:{enemy:"mist_heretic",count:1},reward:{legendary:"lg_saint_rosary",exp:200},auto:!0,requiresAlly:"serin"},{id:"q3_feather",region:3,kind:"collect",name:"폭풍 깃털 수집",giver:"구름다리 화살장인",desc:"좋은 화살을 만들려면 폭풍 깃털 4개가 필요해.",target:{item:"storm_feather",count:4},reward:{gold:380,equip:"epic"}},{id:"q3_bandit",region:3,kind:"kill",name:"공중 다리의 도적",giver:"구름다리 경비대장",desc:"다리를 약탈하는 협곡 도적 4명을 소탕하라.",target:{enemy:"canyon_bandit",count:4},reward:{gold:420,exp:300,items:[{id:"enh_stone_hi",n:1}]}},{id:"q3_arin",region:3,kind:"companion",name:"[아린] 바람의 기억",giver:"아린",desc:"아버지의 모습을 한 바람 망령... 내 손으로 보내 드릴게.",target:{enemy:"wind_wraith",count:1},reward:{legendary:"lg_wind_feather",exp:300},auto:!0,requiresAlly:"arin"},{id:"q4_sentinel",region:4,kind:"kill",name:"유적 파수병 정지",giver:"뇌운 요새 학자",desc:"폭주한 유적 파수병 4기를 멈춰 주십시오.",target:{enemy:"ruin_sentinel",count:4},reward:{gold:560,exp:450,items:[{id:"enh_stone_hi",n:2}]}},{id:"q4_crystal",region:4,kind:"collect",name:"뇌정석 연구",giver:"뇌운 요새 학자",desc:"공허 연구에 뇌정석 4개가 필요합니다.",target:{item:"thunder_crystal",count:4},reward:{gold:500,equip:"epic"}},{id:"q4_doyun",region:4,kind:"companion",name:"[도윤] 스승의 유산",giver:"도윤",desc:"스승님의 마도인형이 공허의 핵에 먹혔어. 내가 멈춰야 해.",target:{enemy:"rampant_doll",count:1},reward:{legendary:"lg_archmage_robe",exp:450},auto:!0,requiresAlly:"doyun"},{id:"q5_letter",region:5,kind:"deliver",name:"갱도의 편지",giver:"돌망치 성채 광부",desc:"무너진 갱도에 갇힌 동료에게 이 편지를 전해 주게.",target:{item:"mine_letter",node:"r5_n10"},giveItem:"mine_letter",reward:{gold:700,exp:600,items:[{id:"feather",n:1}]}},{id:"q5_gem",region:5,kind:"collect",name:"심연 보석 세공",giver:"돌망치 성채 세공사",desc:"심연 보석 4개를 가져오면 최고의 장신구를 만들어 주마.",target:{item:"deep_gem",count:4},reward:{gold:400,equip:"epic"}},{id:"q5_bark",region:5,kind:"companion",name:"[바르크] 배신자의 최후",giver:"바르크",desc:"왕을 팔아넘긴 그롬. 그놈만큼은 내 도끼로 끝낸다.",target:{enemy:"traitor_general",count:1},reward:{legendary:"lg_king_helm",exp:600},auto:!0,requiresAlly:"bark"}],Sa=[{text:"대륙 아르케아. 다섯 원소의 신전이 세계의 균형을 지키는 땅."},{text:"불, 물, 바람, 번개, 땅. 신전의 종이 울리는 한, 세계는 색을 잃지 않는다 — 그렇게 믿어 왔다."},{text:"그날 밤, 국경의 작은 마을 하늘에 검은 균열이 열리기 전까지는."},{speaker:"마을 사람",text:"도, 도망쳐! 저건... 색이, 색이 사라지고 있어!"},{text:"균열에서 흘러나온 잿빛 안개가 닿는 곳마다, 꽃도 집도 사람도 색을 잃고 바스러졌다. 사람들은 그것을 '공허'라고 불렀다."},{speaker:"{hero}",text:"(몸이... 뜨거워. 아니, 차가워. 바람이... 번개가... 이게 뭐지?)"},{text:"공허의 마물이 {hero}에게 손을 뻗은 순간, 다섯 갈래의 빛이 폭발하듯 터져 나왔다."},{speaker:"???",text:"물러서! ...방금 그 빛, 네가 낸 거냐?"},{text:"붉은 갑옷의 기사가 불꽃을 두른 검으로 마물을 베어 넘겼다."},{speaker:"카일",text:"불꽃 기사단의 카일이다. 정확히는... 기사단의 마지막 생존자지."},{speaker:"카일",text:"여러 원소를 한 몸에 담는 체질. 전설 속 '계승자'라는 게 진짜 있었군."},{speaker:"{hero}",text:"계승자...? 난 그냥 이 마을 사람이야. 다들... 다들 어떻게 된 거야?"},{speaker:"카일",text:"공허가 신전을 하나씩 집어삼키고 있다. 신전이 침묵하면 그 땅은 색을 잃어. 네 마을처럼."},{speaker:"카일",text:"가장 가까운 건 잿빛 평원의 불의 신전이다. 신전을 되찾으면 넌 그 원소를 쓸 수 있게 될 거다. 같이 가겠나?"},{speaker:"{hero}",text:"...가자. 더는 아무것도 잃고 싶지 않아."}],Ta=[{text:"잿빛 평원. 한때 붉은 꽃이 끝없이 피던 초원은 이제 타다 남은 재로 뒤덮여 있다."},{speaker:"촌장",text:"기사님! 살아 계셨군요. 신전 골렘이 미쳐 날뛰는 바람에 아무도 신전에 다가가질 못합니다."},{speaker:"카일",text:"골렘은 불의 몸이다. 물에 약하지. 촌장, 물의 원소석이 남아 있나?"},{speaker:"촌장",text:"몇 개 안 되지만 가져가십시오. 상점에서도 조금 팔고 있습니다."},{speaker:"카일",text:"잘 들어, {hero}. 원소가 묻은 적에게 다른 원소를 맞추면 '반응'이 터진다. 불에 물을 맞추면 증발 — 피해가 두 배야."},{speaker:"카일",text:"그리고 약점 원소로 계속 찌르면 적의 브레이크 게이지가 깨진다. 깨진 놈은 한 턴 동안 무방비가 되지."},{speaker:"카일",text:"누가 먼저 움직이고, 어떤 순서로 원소를 쌓을지. 그게 싸움의 전부다."},{text:"[안내] 지도에서 연결된 지점을 눌러 이동하세요. 적이 있는 지점은 피해 갈 수도 있습니다. 휴식처와 마을에서 저장할 수 있어요."}],La=[{text:"불의 신전. 거대한 골렘이 신전 문 앞에 웅크리고 있다. 몸의 균열 사이로 잿빛 용암이 흐른다."},{speaker:"카일",text:"3턴마다 용암을 뿜을 거다. 예고가 보이면 방어하거나... 브레이크로 끊어."},{speaker:"잿불 골렘",text:"...침입자... 소각..."}],Ca=[{text:"골렘이 무너지자, 신전 깊은 곳에서 오래된 종소리가 울렸다."},{speaker:"불의 신전",text:"— 계승자여. 불꽃은 다시 너와 함께 타오르리라."},{text:"[불의 원소 해방] 이제 주인공이 '원소 전환'으로 불 원소를 쓸 수 있습니다."},{speaker:"카일",text:"...잿빛 평원에 다시 색이 돌아오는군. 다음은 서쪽, 물안개 호수다."},{speaker:"카일",text:"그리고... 고맙다. 스승님의 땅을 되찾게 해 줘서."}],Ha=[{text:"물안개 호수. 수상 가옥이 늘어선 마을 '안개나루'는 짙은 안개에 잠겨 있다."},{speaker:"???",text:"거기 두 분! 혹시... 방금 신전의 불꽃을 되살린 분들인가요?"},{speaker:"세린",text:"저는 세린. 물의 신전의 견습 사제예요. 대사제님들은 마녀가 오자마자 신전을 버리고 도망쳤어요."},{speaker:"세린",text:"전 도망치지 않을 거예요. 신전은 제가 되찾을 거예요. ...함께 가도 될까요?"},{speaker:"카일",text:"힐러라면 언제든 환영이다."},{speaker:"세린",text:"마녀는 분신 뒤에 숨어요. 분신에는 원소 반응이 통하지 않으니, 본체를 노려야 해요. 마녀는 번개에 약하다고 들었어요."},{text:"[세린 합류] 파티 관리에서 편성을 바꿀 수 있습니다."}],Aa=[{text:"물의 신전. 깨진 종 아래, 푸른 머리칼의 마녀가 물 위에 떠 있다."},{speaker:"호수의 마녀",text:"어머, 꼬마 사제가 돌아왔네? 신전을 버린 건 너희 대사제들인데, 이제 와서 주인 행세야?"},{speaker:"세린",text:"신전은 누구의 것도 아니에요. 돌려받겠어요!"}],Oa=[{speaker:"호수의 마녀",text:"흥... 그분이... 가만두지 않을 거야... 원소는 결국 한 사람의 것이 될 테니까..."},{text:"마녀가 안개처럼 흩어지자, 깨진 종이 스스로 맑은 소리를 냈다."},{text:"[물의 원소 해방] 주인공이 물 원소를 쓸 수 있습니다."},{speaker:"세린",text:"'그분'... 공허 뒤에 누군가 있다는 걸까요?"},{speaker:"카일",text:"알아낼 수밖에. 다음은 북쪽, 바람의 협곡이다."}],Da=[{text:"바람의 협곡. 천 길 낭떠러지 위로 흔들리는 공중 다리가 마을과 마을을 잇는다."},{speaker:"???",text:"움직이지 마. ...공허 냄새는 안 나네. 외지인이야?"},{speaker:"아린",text:"아린. 이 협곡 사냥꾼이야. 신전 위에 그리폰이 눌러앉은 뒤로 바람이 미쳐 버렸어."},{speaker:"아린",text:"그 녀석은 한 번에 두 번씩 움직여. 느린 파티로는 못 이겨. 내가 순풍으로 너희 차례를 당겨 줄게."},{speaker:"세린",text:"같이 가 주시는 거예요?"},{speaker:"아린",text:"...아빠가 지키던 신전이야. 혼자선 못 가겠더라."},{text:"[아린 합류] 이제 4명이 전투에 나갑니다."}],Na=[{text:"바람의 신전 위 하늘. 폭풍 그리폰이 날개를 펼치자 돌풍이 다리를 뒤흔든다."},{speaker:"아린",text:"급강하가 보이면 조심해. 맞으면 행동이 뒤로 밀려. 불로 날개를 태우자!"}],Ia=[{text:"그리폰이 땅에 떨어지자 미쳐 날뛰던 바람이 잦아들고, 부드러운 순풍이 협곡을 쓸고 지나갔다."},{text:"[바람의 원소 해방] 주인공이 바람 원소를 쓸 수 있습니다."},{speaker:"아린",text:"그리폰 목에... 이건 공허의 낙인이야. 누가 일부러 새긴 거야."},{speaker:"카일",text:"누군가 신전 수호자들을 하나씩 오염시키고 있다는 거군."},{speaker:"아린",text:"뇌운 고원에 공허를 연구하는 괴짜 학자가 있대. 그 사람이라면 뭔가 알지도 몰라."}],Ra=[{text:"뇌운 고원. 쉬지 않고 번개가 내리치는 고지대에 고대 유적이 잠들어 있다."},{speaker:"도윤",text:"오, 손님이네. 마침 잘 왔어. 너희가 신전 세 곳을 해방했다며? 그 데이터 좀 보여 줘."},{speaker:"도윤",text:"도윤이야. 공허를 연구하고 있지. 결론부터 말하면 — 공허는 자연재해가 아니야. 누군가 원소를 '흡수'하면서 생긴 찌꺼기야."},{speaker:"{hero}",text:"흡수...? 원소를?"},{speaker:"도윤",text:"응. 너처럼 원소를 몸에 담을 수 있는 누군가가. 그 이상은 신전 안을 봐야 알 수 있어. 데려가 줘."},{speaker:"도윤",text:"참, 신전의 수호기는 체력이 반쯤 떨어지면 노심이 과열돼서 원소가 바뀔 거야. 대비해 둬."},{text:"[도윤 합류] 대기 멤버는 전투 중 '교대'로 바꿀 수 있습니다 (전투당 2회, 턴 소모 없음)."}],Ba=[{text:"번개의 신전. 고대의 거대 수호기가 붉게 빛나는 눈을 뜬다."},{speaker:"도윤",text:"처음엔 번개, 땅으로 쳐. 노심이 과열되면 불로 바뀌니까 그땐 물이야!"}],ja=[{text:"수호기의 노심이 꺼지고, 신전 벽면에 숨겨져 있던 벽화가 드러났다."},{text:"[번개의 원소 해방] 주인공이 번개 원소를 쓸 수 있습니다."},{speaker:"도윤",text:"이 벽화... 다섯 신전 앞에 선 한 사람. '첫 번째 계승자 아스텔'."},{speaker:"도윤",text:"기록에 따르면 그는 다섯 원소를 모두 품었는데... 이후 행적이 통째로 지워져 있어."},{speaker:"세린",text:"마지막 신전은 지하의 드워프 왕국이에요. 거기서 답을 찾을 수 있을까요?"}],Ua=[{text:"대지의 심연. 지하 깊은 곳, 드워프 왕국의 성채 '돌망치'는 검은 수정으로 뒤덮여 있다."},{speaker:"바르크",text:"멈춰라, 지상 것들. ...아니, 그 빛. 네가 계승자냐?"},{speaker:"바르크",text:"바르크. 왕국의 대장장이다. 우리 왕께선 '그분'에게 영원을 약속받고... 공허를 받아들이셨지."},{speaker:"바르크",text:"그걸 부추긴 건 그롬 장군 놈이다. 왕을 되돌릴 순 없겠지만, 이 도끼로 끝은 내 드려야겠다."},{speaker:"바르크",text:"왕은 암석 갑주를 두른다. 갑주가 있는 동안엔 칼이 안 들어가. 바람으로 갑주부터 부숴라."},{text:"[바르크 합류] 이제 동료가 모두 모였습니다."}],Ga=[{text:"대지의 신전. 검게 물든 왕좌 위에서 드워프 왕이 거대한 망치를 들어 올린다."},{speaker:"타락한 드워프 왕",text:"바르크... 돌아왔느냐. 그분께서 약속하셨다. 원소를 바치면 이 왕국은 영원하리라고!"},{speaker:"바르크",text:"영원한 건 없습니다, 폐하. ...편히 쉬십시오."}],za=[{speaker:"타락한 드워프 왕",text:"바르크... 미안하구나... 아스텔... 그자는 원소를 '나눠 줄' 생각 따위... 없었다..."},{text:"[대지의 원소 해방] 다섯 원소가 모두 해방되었습니다."},{text:"다섯 신전의 종이 동시에 울린 순간, 대륙 한가운데에 잿빛 첨탑이 솟아올랐다."},{speaker:"도윤",text:"이제 다 연결됐어. 공허를 퍼뜨린 건 첫 번째 계승자 아스텔이야."},{speaker:"도윤",text:"그는 다섯 원소를 혼자 독점하려고 신전의 힘을 빨아들였어. 감당 못 한 원소가 썩어서 흘러넘친 게 공허고."},{speaker:"카일",text:"그리고 이제 마지막 남은 원소 그릇을 노리겠지. ...너 말이다, {hero}."},{speaker:"{hero}",text:"그럼 기다릴 필요 없어. 우리가 먼저 간다."},{text:"[공허의 첨탑 개방] 월드맵에서 최종 지역으로 이동할 수 있습니다. 준비를 단단히 하세요."}],Qa=[{text:"공허의 첨탑. 색이 빠진 세계. 하늘도 땅도 잿빛으로 바래 소리조차 희미하다."},{speaker:"아린",text:"...바람이 안 불어. 이런 곳은 처음이야."},{speaker:"세린",text:"괜찮아요. 우리가 가져온 원소가 있잖아요."},{speaker:"바르크",text:"야영지를 꾸려 두었다. 쉬고 갈 땐 여기로 돌아와라."}],Ja=[{text:"첨탑 꼭대기. 다섯 원소가 뒤엉킨 소용돌이 한가운데, 잿빛 망토의 남자가 돌아선다."},{speaker:"아스텔",text:"왔구나, 다음 계승자. 다섯 원소를 모아 줘서 고마워. 이제 그 그릇째로 내가 가져가면 돼."},{speaker:"아스텔",text:"동료? 나눔? 그런 건 약한 자의 변명이야. 원소는 하나의 손에 있을 때 가장 강하지."},{speaker:"{hero}",text:"아니. 혼자 다 가지려 한 너는 결국 공허가 됐잖아. 우린 다섯이 아니라 여섯이야."},{speaker:"아스텔",text:"...그럼 증명해 봐. 너희가 만든 반응, 전부 그대로 되돌려 줄 테니까."}],Fa=[{text:"아스텔의 몸에서 다섯 원소가 빠져나와 각자의 신전으로 돌아갔다."},{speaker:"아스텔",text:"...그렇군. 나눠 쥐는 쪽이... 더 무거웠던 건가..."},{text:"잿빛 첨탑이 무너지고, 색이 빠졌던 하늘에 노을이 번졌다."},{speaker:"카일",text:"끝났군. ...스승님, 보고 계십니까."},{speaker:"세린",text:"신전의 종소리가 들려요. 다섯 개 전부요!"},{speaker:"아린",text:"바람이 다시 분다. 이 냄새, 진짜 오랜만이야."},{speaker:"도윤",text:"공허의 잔해 데이터... 아니, 오늘은 연구 쉬자. 오늘만."},{speaker:"바르크",text:"돌아가면 왕국을 다시 세운다. 다들 망치 들고 와라. 술은 내가 산다."},{speaker:"{hero}",text:"...고마워, 다들. 혼자였으면 절대 못 왔을 거야."},{text:"다섯 원소의 계승자 — 그 이름은 이제 한 사람이 아닌, 여섯 동료 모두를 가리키게 되었다."},{text:"— THE END —  플레이해 주셔서 고마워요!"}],Za={prologue:Sa,r1_intro:Ta,r1_boss_pre:La,r1_boss_post:Ca,r2_intro:Ha,r2_boss_pre:Aa,r2_boss_post:Oa,r3_intro:Da,r3_boss_pre:Na,r3_boss_post:Ia,r4_intro:Ra,r4_boss_pre:Ba,r4_boss_post:ja,r5_intro:Ua,r5_boss_pre:Ga,r5_boss_post:za,r6_intro:Qa,r6_boss_pre:Ja,ending:Fa},Wa=ba,Gt=va,Va=xa,bt=Pn.items,Ka=Pn.legendaries,zt=Pa,Ya=Ea,vt=qa,Xa=Za;function fe(e,t){const n=new Map(e.map(a=>[a.id,a]));return a=>{const s=n.get(a);if(!s)throw new Error(`알 수 없는 ${t}: ${a}`);return s}}const X=fe(Wa,"스킬"),G=fe(Gt,"캐릭터"),xt=fe(Va,"적"),Pe=fe(bt,"아이템"),es=fe(Ka,"전설 장비"),A=fe(zt,"지역"),ts=fe(Ya,"이벤트"),He=fe(vt,
